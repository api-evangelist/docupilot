    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
        clear_other_sessions:
          type: boolean
          default: false
      required:
      - current_password
      - new_password
    Workspace:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          enum:
          - owner
          - admin
          - manager
          - member
          - billing_manager
          type: string
        unique_key:
          type: string
        plan:
          type: string
        users:
          type: integer
        plan_status:
          type: string
      required:
      - id
      - name
      - plan
      - plan_status
      - unique_key
      - users
    VerifyAuthorizationOTP:
      type: object
      properties:
        otp:
          type: string
      required:
      - otp
    Locale:
      type: object
      properties:
        code:
          type: string
        display:
          type: string
      required:
      - code
      - display
    TimeZone:
      type: object
      properties:
        name:
          type: string
        tz:
          type: string
        offset:
          type: string
      required:
      - name
      - offset
      - tz
    ChangeEmail:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          maxLength: 128
      required:
      - email
      - password
    SendAuthorizationOTP:
      type: object
      properties:
        action_name:
          type: string
      required:
      - action_name
  securitySchemes:
    OAuthAuthentication:
      type: http
      scheme: bearer
      description: OAuth2 Bearer Token Authentication
    SessionAuthentication:
      type: apiKey
      in: cookie
      name: sessionid
      description: browser based login takes care of this
externalDocs:
  description: Help docs on how to use API
  url: https://help.docupilot.app/developers/api-overview
