          nullable: true
          maxLength: 255
        success_callback_payload:
          type: object
          additionalProperties: {}
          nullable: true
        success_callback_headers:
          type: object
          additionalProperties: {}
          nullable: true
        last_used_on:
          type: string
          format: date-time
          nullable: true
        url:
          type: string
          maxLength: 255
        headers:
          type: object
          additionalProperties: {}
          nullable: true
        payload:
          type: object
          additionalProperties: {}
          nullable: true
      required:
      - id
      - name
      - url
    SignatureDelivery:
      type: object
      description: ''
      properties:
        id:
          type: integer
          readOnly: true
        failure_email_recipients:
          type: string
          nullable: true
          maxLength: 255
        signers:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              id:
                type: number
              order:
                type: number
              name:
                type: string
                minLength: 3
              email:
                type: string
                format: email
            required:
            - id
            - name
            - email
        use_default_reminders:
          type: boolean
          default: false
        expiry:
          type: integer
          nullable: true
        first_reminder:
          type: integer
          nullable: true
        reminder_frequency:
          type: integer
          nullable: true
        warn_before:
          type: integer
          nullable: true
        sender:
          type: integer
          nullable: true
        sender_mode:
          enum:
          - fixed
          - smart
          type: string
        folder_name:
          type: string
          nullable: true
          readOnly: true
        name:
          type: string
          maxLength: 255
        type:
          enum:
          - webhook
          - azure_blob_storage
          - box_drive
          - signature
