openapi: 3.2.0
info:
  title: Docupilot V2 Linked Accounts API
  version: '3.0'
  description: Docupilot V2 APIs
  termsOfService: https://docupilot.app/terms-and-conditions/
  contact:
    name: Team Docupilot
    email: support@docupilot.app
tags:
- name: Linked Accounts
paths:
  /dashboard/api/v2/linked_accounts/:
    get:
      operationId: list_delivery_accounts
      summary: Get list of linked accounts
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: Workspace unique_key
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: type
        schema:
          type: string
          enum:
          - aws_s3
          - azure_storage
          - box
          - docu_sign
          - dropbox
          - email
          - eversign
          - google_drive
          - hellosign
          - one_drive
          - podio
          - sftp
          - sharepoint
          - sign_now
          - signable
          - yousign
          - zoho
          - zoho_crm
      tags:
      - Linked Accounts
      security:
      - SessionAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeliveryAccount'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: ''
    post:
      operationId: add_delivery_account
      summary: Create linked account
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: Workspace unique_key
        required: true
      tags:
      - Linked Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeliveryAccount'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeliveryAccount'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeliveryAccount'
        required: true
      security:
      - SessionAuthentication: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryAccount'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: ''
  /dashboard/api/v2/linked_accounts/{integrator_type}/invoke/:
    get:
      operationId: invoke_integrator
      description: Redirects to oauth endpoint to add a new linked account of given 'integrator_type'
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: Workspace unique_key
        required: true
      - in: query
        name: environment
        schema:
          type: string
        description: 'sub-type of integrator. For example: sandbox or production for docu_sign'
      - in: path
        name: integrator_type
        schema:
          type: string
          enum:
          - box
          - docu_sign
          - dropbox
          - eversign
          - google_drive
          - one_drive
          - podio
          - sharepoint
          - sign_now
          - zoho
        description: Type of integrator
        required: true
      tags:
      - Linked Accounts
      security:
      - SessionAuthentication: []
      responses:
        '302':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: ''
      summary: Invoke integrator
      x-summary-source: derived
  /dashboard/api/v2/linked_accounts/{id}/:
    put:
      operationId: update_delivery_account
      summary: Refresh linked account
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: Workspace unique_key
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this delivery account.
        required: true
      tags:
      - Linked Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeliveryAccount'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateDeliveryAccount'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateDeliveryAccount'
        required: true
      security:
      - SessionAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryAccount'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: ''
    delete:
      operationId: revoke_delivery_account
      summary: Revoke linked account
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: Workspace unique_key
        required: true
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this delivery account.
        required: true
      tags:
      - Linked Accounts
      security:
      - SessionAuthentication: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: ''
