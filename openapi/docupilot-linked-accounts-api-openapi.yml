components:
  schemas:
    TemplateInfo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
        type:
          type: string
          readOnly: true
      required:
      - id
      - name
      - status
      - type
      description: ''
    SharepointPickerPayload:
      type: object
      properties:
        payload:
          type: string
      required:
      - payload
      description: ''
    DeliveryAccount:
      type: object
      description: ''
      properties:
        id:
          type: integer
          readOnly: true
        sub_type:
          type: string
          readOnly: true
        used_by:
          type: integer
          readOnly: true
        name:
          type:
          - string
          - 'null'
          readOnly: true
        type:
          enum:
          - docu_sign
          - sign_now
          - zoho_crm
          - dropbox
          - google_drive
          - podio
          - one_drive
          - sharepoint
          - eversign
          - box
          - zoho
          - hellosign
          - aws_s3
          - signable
          - yousign
          - email
          - sftp
          - azure_storage
          type: string
        credentials:
          type: object
          additionalProperties: {}
          writeOnly: true
        is_expired:
          type: boolean
          readOnly: true
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        use_for_images:
          type: boolean
      required:
      - credentials
      - id
      - is_expired
      - name
      - sub_type
      - type
      - updated_at
      - used_by
    UnauthenticatedError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
      description: ''
    DocuSignFolder:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        owner:
          $ref: '#/components/schemas/DocuSignFolderOwner'
        folderId:
          type: string
        uri:
          type: string
        itemCount:
          type: string
        hasSubFolders:
          type: string
      required:
      - folderId
      - hasSubFolders
      - itemCount
      - name
      - owner
      - type
      - uri
      description: ''
    SendTestSmtpMail:
      type: object
      properties:
        smtp_server_address:
          type: string
          maxLength: 255
        smtp_server_username:
          type: string
          maxLength: 255
        smtp_server_password:
          type: string
          maxLength: 255
        smtp_port:
          type: integer
        smtp_encryption_type:
          enum:
          - TLS
          - SSL
          type: string
        email:
          type: string
          format: email
      required:
      - email
      - smtp_encryption_type
      - smtp_port
      - smtp_server_address
      - smtp_server_password
      - smtp_server_username
      description: ''
    UpdateDeliveryAccount:
      type: object
      description: ''
      properties:
        id:
          type: integer
          readOnly: true
        sub_type:
          type: string
          readOnly: true
        used_by:
          type: integer
