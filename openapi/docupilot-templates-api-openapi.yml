openapi: 3.0.3
info:
  title: Docupilot accounts APIs ai templates API
  version: '1.0'
  description: Docupilot accounts APIs
  termsOfService: https://docupilot.app/terms-and-conditions/
  contact:
    name: Team Docupilot
    email: support@docupilot.app
tags:
- name: templates
paths:
  /dashboard/api/v2/templates/:
    get:
      operationId: list_templates
      summary: Get list of templates
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: Workspace unique_key
        required: true
      - in: query
        name: delivery_type
        schema:
          type: array
          items:
            type: string
            enum:
            - aws_s3
            - azure_blob_storage
            - box_drive
            - docu_sign
            - dropbox
            - email
            - eversign
            - google_drive
            - hellosign
            - one_drive
            - podio
            - sftp
            - sharepoint
            - sign_now
            - signable
            - signature
            - webhook
            - yousign
            - zoho_crm
        description: Filter templates by configured delivery type (supports multiple values)
        explode: false
        style: form
      - in: query
        name: folder
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: output_type
        schema:
          type: string
          enum:
          - docx
          - html
          - jpeg
          - pdf
          - png
          - pptx
          - xlsx
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Search templates by title
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - test
        description: Filter templates by status. Active maps to published templates and test maps to unpublished templates.
      - in: query
        name: type
        schema:
          type: string
          enum:
          - docx
          - dpt_pdf
          - fillable_pdf
          - g_document
          - g_presentation
          - g_spreadsheet
          - html
          - pptx
          - xlsx
      tags:
      - templates
      security:
      - OAuthAuthentication: []
      - SessionAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTemplateList'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: ''
    post:
      operationId: create_template
      summary: Create template
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: Workspace unique_key
        required: true
      tags:
      - templates
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NewTemplate'
        required: true
      security:
      - OAuthAuthentication: []
      - SessionAuthentication: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
          description: ''
        '413':
          content:
            text/html:
              schema:
                description: Uploaded File Is Too Large.
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: ''
  /dashboard/api/v2/templates/{id}/:
    get:
      operationId: get_template
