components:
  schemas:
    MigrateToNativeSyntaxRequest:
      type: object
      properties:
        provider:
          enum:
          - docusign
          type: string
          default: docusign
        title:
          type: string
      description: ''
    DynamicImage:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        page:
          type: integer
          default: 1
        left:
          type: number
          format: double
        top:
          type: number
          format: double
        width:
          type: number
          format: double
        height:
          type: number
          format: double
      required:
      - height
      - left
      - token
      - top
      - width
      description: ''
    TemplateSchemaDetail:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSchema'
        content_blocks_schema:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/TemplateSchema'
          description: A mapping of content block keys to their respective schema.
        other:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSchema'
      required:
      - content
      - content_blocks_schema
      - other
      description: ''
    UnauthenticatedError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
      description: ''
    SharingInfoTemplate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        is_shared:
          type: boolean
          readOnly: true
      required:
      - id
      - is_shared
      description: ''
    ForbiddenError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
      description: ''
    PatchedUpdateTemplateSharing:
      type: object
      description: ''
      properties:
        id:
          type: integer
          readOnly: true
        permission:
          enum:
          - read
          - write
          - manage
          type: string
        user:
          type: integer
          readOnly: true
    MoveTemplateResponse:
      type: object
      properties:
        success:
          type: array
          items:
            type: integer
          description: List of successfully moved template IDs
        failures:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/TemplateMoveFailureDetail'
          description: Mapping of failed template IDs to error messages
      required:
      - failures
      - success
      description: ''
    MoveTemplate:
      type: object
      properties:
        template_ids:
          type: array
          items:
            type: integer
        new_folder_id:
          type: integer
          nullable: true
      required:
      - new_folder_id
      - template_ids
      description: ''
    FillablePdfSettings:
      type: object
      properties:
        width:
          type: number
          format: double
        height:
          type: number
          format: double
        no_of_pages:
          type: integer
          maximum: 2147483647
          minimum: 0
        dynamic_images:
          type: object
          additionalProperties: {}
          writeOnly: true
          nullable: true
      required:
      - height
      - no_of_pages
      - width
      description: ''
    DeliveryCount:
      type: object
      properties:
        delivery_count:
          type: integer
          description: Number of deliveries linked to the template
      required:
      - delivery_count
      description: ''
    TemplateCount:
      type: object
      properties:
        templates_count:
          type: integer
      required:
      - templates_count
      description: ''
    Folder:
      type: object
      description: ''
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        created_time:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        updated_time:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_by:
          type: integer
          readOnly: true
        updated_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - created_by
      - created_time
      - id
      - name
      - updated_by
      - updated_time
    Template:
      type: object
      description: ''
      properties:
        id:
          type: integer
          readOnly: true
        preferences:
          $ref: '#/components/schemas/TemplateSettings'
        folder:
          allOf:
          - $ref: '#/components/schemas/Folder'
          nullable: true
        has_docusign_delivery:
          type: boolean
          readOnly: true
        published:
          type: boolean
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 255
        type:
          enum:
          - docx
          - html
          - dpt_pdf
          - fillable_pdf
          - pptx
          - xlsx
          - g_document
          - g_presentation
          - g_spreadsheet
          type: string
          readOnly: true
        created_time:
          type: string
          format: date-time
          readOnly: true
        updated_time:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        document_status:
          enum:
          - active
          - test
          type: string
        deleted_time:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        use_v2_editor:
          type: boolean
          readOnly: true
        created_by:
          type: integer
          readOnly: true
        updated_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - created_by
      - created_time
      - deleted_time
      - has_docusign_delivery
      - id
      - published
      - title
      - type
      - updated_by
      - updated_time
      - use_v2_editor
    TemplateSettings:
      type: object
      properties:
        margin:
          type: object
          additionalProperties: false
          properties:
            top:
              type: number
              format: float
              minimum: 0
              maximum: 11
            left:
              type: number
              format: float
              minimum: 0
              maximum: 8
            right:
              type: number
              format: float
              minimum: 0
              maximum: 8
            bottom:
              type: number
              format: float
              minimum: 0
              maximum: 11
          nullable: true
        timezone:
          type: string
        info:
          allOf:
          - $ref: '#/components/schemas/FillablePdfSettings'
          readOnly: true
        dynamic_images:
          type: array
          items:
            $ref: '#/components/schemas/DynamicImage'
          nullable: true
        output_file_name:
          type: string
          maxLength: 255
        output_type:
          enum:
          - html
          - pdf
          - jpeg
          - png
          - docx
          - pptx
          - xlsx
          type: string
        password:
          type: string
          nullable: true
          maxLength: 255
        format:
          enum:
          - A3
          - A4
          - A5
          - Legal
          - Letter
          - Tabloid
          - Custom
          type: string
        orientation:
          enum:
          - portrait
          - landscape
          type: string
        header:
          type: string
          nullable: true
        footer:
          type: string
          nullable: true
        width:
          type: number
          format: double
          maximum: 180
          minimum: 0.4
          nullable: true
        height:
          type: number
          format: double
          maximum: 250
          minimum: 0.5
          nullable: true
        auto_number:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
          nullable: true
        flatten_pdf:
          type: boolean
        emulate_mode:
          enum:
          - print
          - screen
          - null
          type: string
          nullable: true
      required:
      - info
      description: ''
    PatchedEditorVersion:
      type: object
      properties:
        use_v2_editor:
          type: boolean
      description: ''
    PatchedUpdateNewTemplate:
      type: object
      description: ''
      properties:
        file:
          type: string
          format: binary
    EditorVersion:
      type: object
      properties:
        use_v2_editor:
          type: boolean
      description: ''
    NewTemplate:
      type: object
      description: ''
      properties:
        file:
          type: string
          format: binary
        folder:
          type: integer
          nullable: true
        title:
          type: string
          maxLength: 255
        output_type:
          enum:
          - html
          - pdf
          - jpeg
          - png
          - docx
          - pptx
          - xlsx
          type: string
        description:
          type: string
          nullable: true
          maxLength: 255
        template_gallery_id:
          type: integer
      required:
      - output_type
      - title
    RestoreTemplateResponse:
      type: object
      properties:
        status:
          type: string
      required:
      - status
      description: ''
    TemplateSharing:
      type: object
      description: ''
      properties:
        id:
          type: integer
          readOnly: true
        permission:
          enum:
          - read
          - write
          - manage
          type: string
        user:
          type: integer
      required:
      - id
      - user
    TemplateSchema:
      type: object
      properties:
        name:
          type: string
        type:
          enum:
          - string
          - array
          - object
          - generic
          type: string
        rType:
          enum:
          - content_block
          type: string
        generics:
          enum:
          - string
          - array
          - object
          - generic
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSchema'
      required:
      - fields
      - generics
      - name
      - type
      description: ''
    ValidationError:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        non_field_errors:
          type: array
          items:
            type: string
      required:
      - errors
      - non_field_errors
      description: ''
    UploadTemplateImage:
      type: object
      properties:
        upload:
          type: string
          format: binary
      required:
      - upload
      description: ''
    TemplateMoveFailureDetail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
      description: ''
    PaginatedTemplateList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Template'
        has_docusign_templates:
          type: boolean
    NotFoundError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
      description: ''
    CopyTemplate:
      type: object
      properties:
        title:
          type: string
          maxLength: 255
        folder:
          type: integer
          nullable: true
      required:
      - folder
      - title
      description: ''
    TemplateVersion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          nullable: true
          maxLength: 255
        version_type:
          enum:
          - major
          - minor
          - null
          type: string
          nullable: true
        starred:
          type: boolean
        live:
          type: boolean
        created_time:
          type: string
          format: date-time
          readOnly: true
        created_by_user_name:
          type: string
          readOnly: true
      required:
      - created_by_user_name
      - created_time
      - id
      description: ''
    MigrateToNativeSyntaxError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
      description: ''
  securitySchemes:
    OAuthAuthentication:
      type: http
      scheme: bearer
      description: OAuth2 Bearer Token Authentication
    SessionAuthentication:
      type: apiKey
      in: cookie
      name: sessionid
      description: browser based login takes care of this
