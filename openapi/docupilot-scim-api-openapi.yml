openapi: 3.2.0
info:
  title: Docupilot accounts SCIM API
  version: '1.0'
  description: Docupilot accounts APIs
  termsOfService: https://docupilot.app/terms-and-conditions/
  contact:
    name: Team Docupilot
    email: support@docupilot.app
tags:
- name: SCIM
paths:
  /accounts/scim/config/:
    get:
      operationId: get_scim_config
      tags:
      - SCIM
      security:
      - SessionAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScimConfig'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: ''
      summary: Get scim config
      x-summary-source: derived
  /accounts/scim/keys/:
    post:
      operationId: create_scim_key
      tags:
      - SCIM
      security:
      - SessionAuthentication: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScimApiKeyCreateResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: ''
      summary: Create scim key
      x-summary-source: derived
  /accounts/scim/keys/{key_id}/:
    delete:
      operationId: delete_scim_key
      parameters:
      - in: path
        name: key_id
        schema:
          type: integer
        required: true
      tags:
      - SCIM
      security:
      - SessionAuthentication: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: ''
      summary: Delete scim key
      x-summary-source: derived
  /accounts/scim/toggle_provisioning/:
    post:
      operationId: toggle_scim_provisioning
      tags:
      - SCIM
      security:
      - SessionAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScimToggleResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: ''
      summary: Toggle scim provisioning
      x-summary-source: derived
components:
  schemas:
    ScimToggleResponse:
      type: object
      properties:
        provisioning_mode:
          type: string
        scim_config:
          $ref: '#/components/schemas/ScimConfig'
      required:
      - provisioning_mode
      - scim_config
    UnauthenticatedError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    ScimApiKeyCreateResponse:
      type: object
      properties:
        token:
          type: string
        key:
          $ref: '#/components/schemas/ScimApiKey'
      required:
      - key
      - token
    ScimConfig:
      type: object
      properties:
        provisioning_mode:
          type: string
          readOnly: true
        keys:
          type: array
          items:
            $ref: '#/components/schemas/ScimApiKey'
          readOnly: true
        scim_base_url:
          type: string
          readOnly: true
      required:
      - keys
      - provisioning_mode
      - scim_base_url
    ForbiddenError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    ValidationError:
      type: object
      properties:
        errors:
          type: object
          additionalProperties: {}
        non_field_errors:
          type: array
          items:
            type: string
      required:
      - errors
      - non_field_errors
    NotFoundError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    ScimApiKey:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_active
      - last_used_at
  securitySchemes:
    OAuthAuthentication:
      type: http
      scheme: bearer
      description: OAuth2 Bearer Token Authentication
    SessionAuthentication:
      type: apiKey
      in: cookie
      name: sessionid
      description: browser based login takes care of this
externalDocs:
  description: Help docs on how to use API
  url: https://help.docupilot.app/developers/api-overview
