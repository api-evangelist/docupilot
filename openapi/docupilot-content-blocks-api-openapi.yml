      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/TemplateInfo'
    TemplateSchema:
      type: object
      properties:
        name:
          type: string
        type:
          enum:
          - string
          - array
          - object
          - generic
          type: string
        rType:
          enum:
          - content_block
          type: string
        generics:
          enum:
          - string
          - array
          - object
          - generic
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSchema'
      required:
      - fields
      - generics
      - name
      - type
      description: ''
