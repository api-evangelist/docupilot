    UnauthenticatedError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
      description: ''
    ContentBlockDetailByKeyResponse:
      type: object
      properties:
        name:
          type: string
        type:
          enum:
          - docx
          - html
          type: string
        schema:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSchema'
      required:
      - name
      - schema
      - type
      description: ''
    ForbiddenError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
      description: ''
