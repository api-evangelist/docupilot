          type: string
      required:
      - file_name
      - file_url
      description: ''
    PatchedContentBlockEditorVersion:
      type: object
      properties:
        use_v2_editor:
          type: boolean
      description: ''
    TemplateInfo:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        status:
          type: string
          readOnly: true
        type:
          type: string
          readOnly: true
      required:
      - id
      - name
      - status
      - type
      description: ''
    CopyContentBlock:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
