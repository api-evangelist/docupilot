openapi: 3.0.3
info:
  title: Docupilot accounts APIs ai users API
  version: '1.0'
  description: Docupilot accounts APIs
  termsOfService: https://docupilot.app/terms-and-conditions/
  contact:
    name: Team Docupilot
    email: support@docupilot.app
tags:
- name: users
paths:
  /dashboard/accounts/v2/users/exchange_session/:
    get:
      operationId: get_exchange_session_code
      description: Generates a short-lived UUID code linked to the current session key for cross-domain migration.
      summary: Exchange session for a migration code
      tags:
      - users
      security:
      - SessionAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExchangeSessionResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: ''
  /dashboard/accounts/v2/users/initiate_authorization_sequence/:
    post:
      operationId: initiate_authorization_sequence
      summary: Initiate a re-authorization sequence that would verify authenticity of logged-in userin order to allow performing high security operations like delete workspace
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateAuthorizationSequence'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/InitiateAuthorizationSequence'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/InitiateAuthorizationSequence'
      security:
      - SessionAuthentication: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
  /dashboard/accounts/v2/users/me/:
    get:
      operationId: get_me
      summary: get logged in user details
      tags:
      - users
      security:
      - OAuthAuthentication: []
      - SessionAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
  /dashboard/accounts/v2/users/migrate_session/:
    get:
      operationId: attach_session_from_exchange_code
      description: Endpoint called on the API domain to exchange a short-lived code for a session cookie.
      summary: Migrate session to API domain
      parameters:
      - in: query
        name: org
        schema:
          type: string
        description: The organization subdomain (e.g., 'rush')
        required: true
      - in: query
        name: session_exchange_code
        schema:
          type: string
        description: The one-time UUID exchange code obtained from /exchange_session/
        required: true
      tags:
      - users
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrateSessionResponse'
          description: ''
  /dashboard/accounts/v2/users/update_user_profile/:
    patch:
      operationId: update_user_profile
      summary: Update User Profile
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateUser'
      security:
      - SessionAuthentication: []
      responses:
        '202':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: ''
components:
  schemas:
    UnauthenticatedError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
      description: ''
    ExchangeSessionResponse:
      type: object
      properties:
        code:
          type: string
      required:
      - code
      description: ''
    ValidationError:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        non_field_errors:
          type: array
          items:
            type: string
      required:
      - errors
      - non_field_errors
      description: ''
    ForbiddenError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
      description: ''
    PatchedUpdateUser:
      type: object
      properties:
        locale:
          type: string
          nullable: true
          maxLength: 5
        theme:
          enum:
          - light
          - dark
          - system
          type: string
      description: ''
    InitiateAuthorizationSequence:
      type: object
      properties:
        action_name:
          enum:
          - delete workspace
          - transfer ownership
          type: string
          default: delete workspace
      description: ''
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        guid:
          type: string
          format: uuid
