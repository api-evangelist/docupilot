openapi: 3.2.0
info:
  title: Docupilot Team API
  contact:
    name: Team Docupilot
    email: support@docupilot.app
  termsOfService: https://docupilot.app/terms-and-conditions/
  version: '1.0'
  description: 'Operations tagged team across 2 of this provider''s published API definitions: openapi-accounts.yaml, openapi-app.yaml. Each path carries the servers of the definition it was published in.'
tags:
- name: Team
paths:
  /accounts/team/:
    get:
      operationId: list_all_team_members
      summary: List all team members
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - member
          - owner
      tags:
      - Team
      security:
      - SessionAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: ''
  /accounts/team/{id}/change_role/:
    put:
      operationId: change_role_of_team_member
      summary: Change role of team member at organization level
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Team
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRole'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangeRole'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangeRole'
        required: true
      security:
      - SessionAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: ''
  /accounts/team/{id}/toggle_user_status/:
    patch:
      operationId: toggle_user_status
      summary: Activate or Deactivate a User
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Team
      security:
      - SessionAuthentication: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: ''
  /accounts/team/transfer_ownership/:
    put:
      operationId: transfer_ownership_to_admin_user
      summary: Transfer Ownership To Admin User
      tags:
      - Team
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnership'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TransferOwnership'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TransferOwnership'
        required: true
      security:
      - SessionAuthentication: []
      responses:
        '204':
          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: ''
  /dashboard/accounts/v2/team/:
    get:
      operationId: list_all_team_members
      summary: List all team members
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: Workspace unique_key
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: role
        schema:
          type: string
          enum:
          - admin
          - billing_manager
          - manager
          - member
          - owner
      tags:
      - Team
      security:
      - OAuthAuthentication: []
      - SessionAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember_2'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError_2'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError_2'
          description: ''
  /dashboard/accounts/v2/team/{id}/change_role/:
    put:
      operationId: change_role_of_team_member
      summary: Change role of team member
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: Workspace unique_key
        required: true
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - Team
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeRole_2'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangeRole_2'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangeRole_2'
        required: true
      security:
      - OAuthAuthentication: []
      - SessionAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember_2'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError_2'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError_2'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError_2'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError_2'
          description: ''
  /dashboard/accounts/v2/team/{id}/toggle_user_status/:
    patch:
      operationId: toggle_user_status
      summary: Activate or Deactivate a User
      parameters:
      - in: header
        name: X-Workspace
        schema:
          type: string
        description: Workspace unique_key
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Team
      security:
      - OAuthAuthentication: []
      - SessionAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember_2'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError_2'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError_2'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError_2'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError_2'
          description: ''
components:
  schemas:
    TransferOwnership:
      type: object
      properties:
        transfer_to:
          type: integer
        otp:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - otp
      - transfer_to
    ChangeRole:
      type: object
      properties:
        role:
          enum:
          - admin
          - member
          type: string
      required:
      - role
    UnauthenticatedError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    ForbiddenError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    TeamMember:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        first_name:
          type: string
          maxLength: 50
        last_name:
          type: string
          maxLength: 50
        email:
          type: string
          format: email
          maxLength: 255
        role:
          enum:
          - owner
          - admin
          - member
          type: string
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect this instead of deleting accounts.
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/Workspace'
          readOnly: true
      required:
      - email
      - id
      - workspaces
    Workspace:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          enum:
          - owner
          - admin
          - manager
          - member
          - billing_manager
          type: string
        unique_key:
          type: string
        plan:
          type: string
        users:
          type: integer
        plan_status:
          type: string
      required:
      - id
      - name
      - plan
      - plan_status
      - unique_key
      - users
    ValidationError:
      type: object
      properties:
        errors:
          type: object
          additionalProperties: {}
        non_field_errors:
          type: array
          items:
            type: string
      required:
      - errors
      - non_field_errors
    NotFoundError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    ChangeRole_2:
      type: object
      properties:
        role:
          enum:
          - owner
          - admin
          - manager
          - member
          - billing_manager
          type: string
      required:
      - role
      description: ''
    UnauthenticatedError_2:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
      description: ''
    ForbiddenError_2:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
      description: ''
    TeamMember_2:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        role:
          enum:
          - owner
          - admin
          - manager
          - member
          - billing_manager
          type: string
        deactivated_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - user
      description: ''
    ValidationError_2:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        non_field_errors:
          type: array
          items:
            type: string
      required:
      - errors
      - non_field_errors
      description: ''
    NotFoundError_2:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
      description: ''
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        guid:
          type: string
          format: uuid
          readOnly: true
          description: globally unique identifier for user
        first_name:
