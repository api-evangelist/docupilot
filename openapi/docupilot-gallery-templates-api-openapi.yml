openapi: 3.2.0
info:
  title: Docupilot V2 Gallery templates API
  version: '3.0'
  description: Docupilot V2 APIs
  termsOfService: https://docupilot.app/terms-and-conditions/
  contact:
    name: Team Docupilot
    email: support@docupilot.app
tags:
- name: Gallery templates
paths:
  /dashboard/accounts/v2/template_gallery/:
    get:
      operationId: list_gallery_templates
      summary: Get list of galery templates
      parameters:
      - in: query
        name: category
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Gallery templates
      security:
      - OAuthAuthentication: []
      - SessionAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TemplateGallery'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: ''
  /dashboard/accounts/v2/template_gallery/{id}/:
    get:
      operationId: get_gallery_template
      summary: Get one template
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this template gallery.
        required: true
      tags:
      - Gallery templates
      security:
      - OAuthAuthentication: []
      - SessionAuthentication: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateGallery'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthenticatedError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundError'
          description: ''
components:
  schemas:
    UnauthenticatedError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
      description: ''
    ForbiddenError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
      description: ''
    GalleryCategory:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
      description: ''
    TemplateGallery:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        image_path:
          type: string
          readOnly: true
        file_type:
          type: string
          readOnly: true
        category:
          $ref: '#/components/schemas/GalleryCategory'
        title:
          type: string
          maxLength: 50
        description:
          type:
          - string
          - 'null'
          maxLength: 255
        images_count:
          type:
          - integer
          - 'null'
          maximum: 32767
          minimum: 0
      required:
      - category
      - file_type
      - id
      - image_path
      - title
      description: ''
    NotFoundError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
      description: ''
  securitySchemes:
    OAuthAuthentication:
      type: http
      scheme: bearer
      description: OAuth2 Bearer Token Authentication
    SessionAuthentication:
      type: apiKey
      in: cookie
      name: sessionid
      description: browser based login takes care of this
    tokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Token-based authentication with required prefix "Basic"
externalDocs:
  description: Help docs on how to use API
  url: https://help.docupilot.app/developers/api-overview
